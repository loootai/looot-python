[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "looot"
dynamic = ["version"]
description = "Official Python client for the looot API: search, inspect and run data provider operations with one token and one prepaid balance."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "looot", email = "support@looot.ai" }]
dependencies = ["httpx>=0.27,<1"]
keywords = ["looot", "api", "sdk", "enrichment", "email finder", "email verification", "serp", "scraping", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "respx==0.23.1"]

[project.urls]
Homepage = "https://looot.ai"
Documentation = "https://docs.looot.ai"
"API reference" = "https://docs.looot.ai/reference"
Source = "https://github.com/loootai/looot-python"
Changelog = "https://github.com/loootai/looot-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/loootai/looot-python/issues"

[tool.hatch.version]
path = "src/looot/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/looot"]

[tool.hatch.build.targets.sdist]
include = ["src/looot", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = ["live: calls looot's free public routes over the network"]
addopts = "-m 'not live'"
