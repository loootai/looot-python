# Tests on every push to main and every pull request. Offline only: no token, no paid route.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: bash scripts/leak-scan.sh .
      - run: python scripts/gen_async.py --check
      - run: pytest
      - name: Free public routes (no token)
        run: pytest -m live
        continue-on-error: true
