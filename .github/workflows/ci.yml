# CI for looot-python. Not enabled: GitHub Actions stay off until the owner turns them on.
# Once on, switch the trigger to push and pull_request.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.lock
      - run: bash scripts/leak-scan.sh .
      - run: pytest
      - run: pytest -m live
